name: Rust

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      release_build:
        description: "Run the release packaging jobs instead of lint-and-test"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to name and publish assets under"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  lint-and-test:
    if: ${{ !inputs.release_build }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  build-release:
    if: ${{ inputs.release_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            executable: mixosc
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
            executable: mixosc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            executable: mixosc.exe
    runs-on: ${{ matrix.os }}
    env:
      ASSET_BASENAME: mixosc-${{ inputs.release_tag }}-${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release binary
        shell: bash
        run: |
          mkdir -p dist "${RUNNER_TEMP}/mixosc-package/${ASSET_BASENAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "${RUNNER_TEMP}/mixosc-package/${ASSET_BASENAME}/"
          cp README.md LICENSE "${RUNNER_TEMP}/mixosc-package/${ASSET_BASENAME}/"
          tar -C "${RUNNER_TEMP}/mixosc-package" -czf "dist/${ASSET_BASENAME}.tar.gz" "${ASSET_BASENAME}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_BASENAME }}
          path: dist/

  publish-release-assets:
    if: ${{ inputs.release_build }}
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -name '*.tar.gz' | sort)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found in dist/"
            find dist -maxdepth 3 -print
            exit 1
          fi
          gh release upload "$TAG_NAME" "${artifacts[@]}" --clobber --repo "$REPOSITORY"
