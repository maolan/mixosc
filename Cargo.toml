[package]
name = "mixosc"
version = "0.0.17"
edition = "2024"
description = "Rust OSC client and control surface for Behringer X32-family mixers"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/mixosc"
homepage = "https://maolan.rs"
keywords = ["audio", "osc", "x32", "mixer"]
categories = ["multimedia::audio"]

[dependencies]
maolan-widgets = { version = "0.1.3", optional = true }
tokio = { version = "1.54.1", features = ["net", "time"] }

[features]
default = ["gui"]
gui = ["dep:maolan-widgets"]

[[bin]]
name = "mixosc"
path = "src/main.rs"
required-features = ["gui"]
